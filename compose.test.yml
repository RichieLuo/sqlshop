name: sqlshop-tests

services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:23306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${SQLSHOP_DOCKER_PASSWORD:?Set the test password in .env.test}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - ./tests/docker/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 40

  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:25432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SQLSHOP_DOCKER_PASSWORD:?Set the test password in .env.test}
      POSTGRES_DB: postgres
    volumes:
      - ./tests/docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 40

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    ports:
      - "127.0.0.1:21433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "2048"
      MSSQL_SA_PASSWORD: ${SQLSHOP_DOCKER_PASSWORD:?Set the test password in .env.test}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s
