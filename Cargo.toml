[package]
name = "sqlshop"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A local-first Rust desktop database client"

[dependencies]
aes-gcm = { version = "0.11", features = ["zeroize"] }
anyhow = "1"
chrono = "0.4"
csv = "1"
directories = "6"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = "0.33"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"
rust_decimal = "1"
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "mysql", "postgres", "chrono", "rust_decimal", "uuid", "json"] }
tiberius = { version = "0.12", default-features = false, features = ["rustls", "chrono", "rust_decimal", "tds73"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSColor"] }
objc2-foundation = { version = "0.2.2", features = ["NSData", "NSThread"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "macos_icon"
harness = false

[profile.release]
lto = "thin"
strip = true
