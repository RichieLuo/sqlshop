[package]
name = "sqlshop"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A local-first Rust desktop database client"

[package.metadata.shop]
product-name = "SQLShop"

[dependencies]
aes-gcm = { version = "0.11", features = ["zeroize"] }
anyhow = "1"
chrono = "0.4"
csv = "1"
directories = "6"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
egui_extras = "0.33"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
redis = { version = "1.7.1", default-features = false, features = ["tokio-rustls-comp"] }
rfd = "0.17"
rust_decimal = "1"
rustls-native-certs = "0.8"
rusqlite = { version = "0.32.1", features = ["bundled", "column_decltype", "extra_check"] }
oracle = "0.6.3"
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "mysql", "postgres", "chrono", "rust_decimal", "uuid", "json"] }
tiberius = { version = "0.12", default-features = false, features = ["rustls", "chrono", "rust_decimal", "tds73"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "process"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "windows")'.dependencies]
tiberius = { version = "0.12", default-features = false, features = ["winauth"] }
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2 = { version = "0.5.3", default-features = false }
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSColor", "NSGraphics", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.2.2", features = ["NSData", "NSThread", "NSGeometry", "NSDictionary", "NSObject", "NSString", "NSUserDefaults", "NSValue"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winres = "0.1"

[[test]]
name = "macos_icon"
harness = false

# Work around a Rust 1.95 incremental metadata encoder ICE in vendored drivers.
[profile.dev]
incremental = false

[profile.release]
lto = "thin"
strip = true

# Preserve upstream query protocol events needed by the result/messages pages.
[patch.crates-io]
sqlx-mysql = { path = "vendor/sqlx-mysql" }
sqlx-postgres = { path = "vendor/sqlx-postgres" }
tiberius = { path = "vendor/tiberius" }
