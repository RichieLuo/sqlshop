name: Rust
on: [push, pull_request]
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libclang-dev clang libx11-dev libxkbcommon-dev libwayland-dev libdbus-1-dev libgtk-3-dev libasound2-dev libudev-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Create temporary test credentials
        run: |
          python3 - <<'PY'
          import secrets
          from pathlib import Path

          password = 'Aa1!' + secrets.token_hex(24)
          path = Path('.env.test')
          path.write_text(f'SQLSHOP_DOCKER_PASSWORD={password}\n')
          path.chmod(0o600)
          PY
      - name: Start and wait for three databases
        timeout-minutes: 10
        run: python3 scripts/test-docker.py up
      - name: Run real database integration tests
        timeout-minutes: 40
        run: python3 scripts/test-docker.py test-all
      - name: Remove test containers and volumes
        if: always()
        timeout-minutes: 5
        run: python3 scripts/test-docker.py down
